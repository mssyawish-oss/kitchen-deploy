:root{
  --red:#C13A27; --red-dark:#a72e1f; --cream:#f3ecda; --panel-cream:#f8f2e4;
  --card:#fbf6ea; --card-ready:#fdfbf4; --ink:#1c1a17; --muted:#8a8175;
  --pill:#C13A27; --pill-ink:#fff; --line:#e7ddc7;
  --head:'JakobSC','Arial Narrow',Impact,system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--cream);color:var(--ink);font-family:var(--body);
  -webkit-font-smoothing:antialiased;user-select:none;cursor:none}
.wrap{height:100vh;display:flex;flex-direction:column;padding:1.6vh 1.6vw}
/* ---- header ---- */
header{height:14vh;min-height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.logo{grid-column:2;justify-self:center;height:11vh;width:auto;display:block}


.clock{grid-column:3;justify-self:end;font-family:var(--head);color:var(--red);
  font-size:5vh;letter-spacing:1px;display:flex;align-items:baseline;gap:.5vw}
.clock .ap{font-size:2.4vh}
/* ---- board ---- */
.board{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1.4vw;margin-top:1vh;min-height:0}
.col{border-radius:22px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.col.prog{background:var(--red)}
.col.ready{background:var(--panel-cream);border:2px solid #eaddc2}
.col h2{font-family:var(--head);font-size:6vh;letter-spacing:1px;padding:2.2vh 1.6vw .8vh;
  display:flex;align-items:center;justify-content:center;gap:1vw}
.col.prog h2{color:#fff}
.col.ready h2{color:var(--ink)}
.sun{width:4.4vh;height:4.4vh;flex:0 0 auto}
.list{flex:1;display:flex;flex-direction:column;gap:1.05vh;padding:.6vh 1.2vw 1.4vh;min-height:0;overflow:hidden}
/* ---- cards ---- */
.card{background:var(--card);border-radius:16px;display:flex;align-items:center;
  padding:1.6vh 1.4vw;gap:1.1vw;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.col.ready .card{background:var(--card-ready);box-shadow:none;border-bottom:1px solid var(--line);border-radius:14px}
.card .who{flex:1 1 40%;min-width:0}
.card .nm{font-weight:800;font-size:3.9vh;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .badge{flex:0 0 auto;width:7.4vh;height:7.4vh;display:flex;align-items:center;justify-content:center}
.card .badge img{width:100%;height:100%;object-fit:contain;border-radius:20%}
.card .mid{flex:0 0 26%;text-align:left}
.card .num{font-weight:800;font-size:3.9vh;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tm{font-size:2.4vh;color:var(--muted);margin-top:.2vh}
.card .pill{flex:0 0 auto;margin-left:auto;background:var(--pill);color:var(--pill-ink);
  border-radius:12px;padding:1.2vh 1.4vw;display:flex;align-items:center;gap:.6vw;
  font-weight:800;font-size:3.6vh;min-width:11vw;justify-content:center}
.card .pill svg{width:3.6vh;height:3.6vh;flex:0 0 auto}
/* new-order pulse: border of that one card only */
@keyframes newpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}
  50%{box-shadow:0 0 0 .5vh #ffd24a,0 0 2vh rgba(255,210,74,.6)}}
.card.isnew{animation:newpulse 1.1s ease-in-out 4}
.col.ready .card.isnew{animation:newpulse-r 1.1s ease-in-out 4}
@keyframes newpulse-r{0%,100%{box-shadow:0 0 0 0 rgba(193,58,39,0)}
  50%{box-shadow:0 0 0 .5vh #C13A27,0 0 2vh rgba(193,58,39,.45)}}
.empty{color:var(--muted);font-size:2.4vh;padding:2vh 1.3vw;opacity:.7}
.col.prog .empty{color:#f7d9d4}
/* page dots for rotation */
.dots{display:flex;gap:.6vw;justify-content:center;padding:.4vh 0 .2vh}
.dots i{width:1vh;height:1vh;border-radius:50%;background:rgba(0,0,0,.18)}
.col.prog .dots i{background:rgba(255,255,255,.35)}
.dots i.on{background:var(--ink)}
.col.prog .dots i.on{background:#fff}
/* ---- PORTRAIT: rotate the tablet long-ways. Keep the two panels SIDE BY SIDE but
   narrower, using the full tall height, so each column fits many more orders. Type
   re-bases on vw (the narrow side) and cards go compact so both fit in a half-width
   column, including the IN PROGRESS wait pill. ---- */
@media (orientation:portrait){
  .wrap{padding:1.1vh 1.4vw}
  header{height:auto;min-height:0;grid-template-columns:1fr auto 1fr;padding:.5vh 0}
  .logo{height:5vw}
  .clock{font-size:3.6vw} .clock .ap{font-size:1.9vw}
  .board{grid-template-columns:1fr 1fr;gap:1.2vw;margin-top:.8vh}
  .col{border-radius:16px}
  .col h2{font-size:3.4vw;padding:1vh 1.6vw .3vh;gap:1.4vw}
  .sun{width:3.2vw;height:3.2vw}
  .list{gap:.8vh;padding:.5vh 1.2vw 1vh}
  .card{padding:.85vh 1.4vw;gap:1.4vw;border-radius:11px;flex-wrap:wrap}
  .card .badge{width:5vw;height:5vw}
  .card .who{flex:1 1 auto}
  .card .nm{font-size:2.6vw} .card .num{font-size:2.4vw} .card .tm{font-size:1.7vw}
  .card .mid{flex:0 0 auto}
  .card .pill{font-size:2.3vw;min-width:0;padding:.5vh 1.4vw;gap:.8vw;border-radius:9px}
  .card .pill svg{width:2.3vw;height:2.3vw}
  .empty{font-size:2.2vw;padding:1.4vh 1.4vw}
  .dots i{width:1.1vw;height:1.1vw}
}
/* DENSITY TIERS: as the board fills, tighten vertical spacing so more orders fit before it needs to
   scroll — text size is kept for readability. Applied adaptively by render() when a column overflows. */
.board.d1 .card{padding-top:.5vh;padding-bottom:.5vh}
.board.d1 .list{gap:.55vh}
.board.d1 .card .nm,.board.d1 .card .num{font-size:2.55vh}
.board.d1 .card .badge{width:5vh;height:5vh}
.board.d1 .card .tm{font-size:1.7vh}
.board.d1 .card .pill{font-size:2.5vh}
.board.d2 .card{padding-top:.3vh;padding-bottom:.3vh}
.board.d2 .list{gap:.35vh}
.board.d2 .card .nm,.board.d2 .card .num{font-size:2.15vh}
.board.d2 .card .badge{width:4.2vh;height:4.2vh}
.board.d2 .card .tm{font-size:1.5vh}
.board.d2 .card .pill{font-size:2.1vh;min-width:8vw;padding:.5vh 1vw}
/* BIG mode (?big=1): ~double-size cards for reading from 3-4m. Density shrink is disabled in big mode
   (cards stay big); overflow is handled purely by the slow auto-scroll. */
.board.big .list{gap:1.2vh;padding:.8vh 1.2vw 1.4vh}
/* wait pill sits on the NAME row (line 1, right); number+time drop to line 2 under the name */
.board.big .card{padding:1.1vh 1.7vw;gap:1.3vw;border-radius:20px;flex-wrap:wrap;align-items:center;row-gap:.1vh}
.board.big .card .badge{order:1;width:8.5vh;height:8.5vh}
.board.big .card .who{order:2;flex:1 1 auto;min-width:0}
.board.big .card .nm{font-size:6vh}
.board.big .card .pill{order:3;margin-left:auto;font-size:3.8vh;min-width:auto;padding:.7vh 1.4vw;gap:.6vw}
.board.big .card .pill svg{width:3.8vh;height:3.8vh}
.board.big .card .mid{order:4;flex:1 1 100%;display:flex;align-items:baseline;gap:1.4vw;margin-left:calc(8.5vh + 1.3vw)}
.board.big .card .num{font-size:3.4vh}
.board.big .card .tm{font-size:2.6vh;margin-top:0}
.board.big .col h2{font-size:5.2vh;white-space:nowrap;padding:2.8vh 1.6vw 1.2vh}
.board.big .empty{font-size:4vh}
@media (orientation:portrait){
  /* portrait big: GRID so the narrow column can't wrap the pill onto its own line.
     badge spans left; name + timer on row1; number+time on row2 → clean 2 rows. */
  .board.big .card{display:grid;grid-template-columns:auto 1fr auto;column-gap:1.3vw;row-gap:.1vh;align-items:center}
  .board.big .card .badge{grid-row:1 / span 2;width:8.5vw;height:8.5vw}
  .board.big .card .who{grid-column:2 / span 2;grid-row:1;flex:none;min-width:0}
  .board.big .card .nm{font-size:5vw}
  .board.big .card .mid{grid-column:2;grid-row:2;flex:none;margin-left:0;min-width:0;display:flex;gap:1vw;align-items:baseline}
  .board.big .card .num{font-size:3.6vw}
  .board.big .card .tm{font-size:2.5vw}
  .board.big .card .pill{grid-column:3;grid-row:2;align-self:center;justify-self:end;margin-left:0;font-size:3.2vw;padding:.7vh 1.6vw;white-space:nowrap;flex:0 0 auto}
  .board.big .card .pill svg{width:3.6vw;height:3.6vw}
}
@media (orientation:portrait){
  .board.d1 .card{padding-top:.45vh;padding-bottom:.45vh}
  .board.d1 .card .nm,.board.d1 .card .num{font-size:2.3vw}
  .board.d1 .card .badge{width:4.4vw;height:4.4vw}
  .board.d2 .card{padding-top:.28vh;padding-bottom:.28vh}
  .board.d2 .card .nm,.board.d2 .card .num{font-size:2.05vw}
  .board.d2 .card .badge{width:4vw;height:4vw}
  .board.d2 .card .tm{font-size:1.5vw}
  .board.d2 .card .pill{font-size:1.9vw;min-width:0}
}
</style>

let DATA={in_progress:[],ready:[]}; const seen=new Set();
function _hydrate(o){return {id:o.id,name:o.name,number:o.number,source:o.source,created:new Date(o.created)};}
let _lastAge=null;
async function fetchOrders(){
  const r=await fetch('/api/order_status',{cache:'no-store'});
  if(!r.ok) throw new Error('status '+r.status);
  const d=await r.json();
  _lastAge=(typeof d.board_age_s==='number')?d.board_age_s:null;
  return {in_progress:(d.in_progress||[]).map(_hydrate), ready:(d.ready||[]).map(_hydrate)};
}

const CLOCK=document.getElementById('ct'),AP=document.getElementById('ap');
function tickClock(){const d=new Date();let h=d.getHours(),m=d.getMinutes();const ap=h>=12?'PM':'AM';
  h=h%12||12;CLOCK.textContent=h+':'+String(m).padStart(2,'0');AP.textContent=ap;}
function fmtTime(dt){let h=dt.getHours(),m=dt.getMinutes();const ap=h>=12?'PM':'AM';h=h%12||12;
  return h+':'+String(m).padStart(2,'0')+' '+ap;}
function waitMin(dt){return Math.max(0,Math.floor((Date.now()-dt.getTime())/60000));}
const CLK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function cardHTML(o,ready){
  const sk=srcOf(o.source),s=SOURCES[sk];
  const badge='<div class="badge"'+(s.bg?' style="background:'+s.bg+';border-radius:18%"':'')+'>'+s.icon+'</div>';
  let h='<div class="card'+(seen.has(o.id)?'':' isnew')+'" data-id="'+o.id+'">'
    +badge
    +'<div class="who"><div class="nm">'+esc(o.name)+'</div></div>'
    +'<div class="mid"><div class="num">'+esc(o.number||'')+'</div><div class="tm">'+fmtTime(o.created)+'</div></div>';
  // (removed the red "X min waited" pill — customers misread it as minutes-until-ready; the grey order time is enough)
  h+='</div>';
  return h;
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// simple auto-rotation when a column has more cards than fit
const pageState={prog:0,ready:0};
function renderColumn(key,items,ready){
  const list=document.getElementById(key+'-list'),dots=document.getElementById(key+'-dots');
  if(dots)dots.innerHTML='';                                // no more page-flipping — we shrink + scroll
  if(!items.length){list.innerHTML='';list.scrollTop=0;return;}   // empty column shows nothing (no placeholder text)
  list.innerHTML=items.map(o=>cardHTML(o,ready)).join('');   // render ALL — nothing is hidden
}
function capacityOf(list){
  const first=list.querySelector('.card'); if(!first)return 99;
  const ch=first.getBoundingClientRect().height+ (parseFloat(getComputedStyle(list).rowGap)||0);
  const avail=list.clientHeight; return Math.max(1,Math.floor(avail/ch));
}
// scroll manager: when orders overflow, BOTH columns auto-scroll TOGETHER in the SAME direction
// (down together, pause, up together, pause) using one shared phase, so they never drift apart.
// Each column maps the shared 0..1 phase onto its own overflow amount.
let _scrPhase=0,_scrDir=1,_scrPause=performance.now()+1500;
function setupScroll(){}                                    // no-op: the shared ticker reads the DOM live
function _scrollTick(t){
  const cols=['prog-list','ready-list'].map(id=>document.getElementById(id)).filter(Boolean);
  const overs=cols.map(l=>Math.max(0,l.scrollHeight-l.clientHeight));
  const maxOver=Math.max(0,...overs);
  if(maxOver<=6){cols.forEach(l=>{l.scrollTop=0;});_scrPhase=0;_scrDir=1;_scrPause=t+1200;requestAnimationFrame(_scrollTick);return;}
  if(t>=_scrPause){
    _scrPhase+=(_scrDir*0.62)/maxOver;                      // ~37px/sec on the longest column — a touch faster
    if(_scrPhase>=1){_scrPhase=1;_scrDir=-1;_scrPause=t+2000;}
    else if(_scrPhase<=0){_scrPhase=0;_scrDir=1;_scrPause=t+2000;}
  }
  cols.forEach((l,i)=>{l.scrollTop=_scrPhase*overs[i];});
  requestAnimationFrame(_scrollTick);}
requestAnimationFrame(_scrollTick);
function _overflows(){return ['prog-list','ready-list'].some(id=>{const l=document.getElementById(id);return l&&(l.scrollHeight-l.clientHeight>6);});}
// ---- idle splash (no orders on the board) ----
// Loads the Bruno's character animation (/static/idle_anim.html) into an iframe only while the board
// is empty, and blanks it when orders return so it uses zero CPU during service.
const IDLE_ANIM_SRC='/static/idle_anim.html';
let _idleOn=false;
function _idleStart(){
  if(_idleOn)return; _idleOn=true;
  const fr=document.getElementById('idle-frame');
  if(fr && fr.getAttribute('src')!==IDLE_ANIM_SRC) fr.setAttribute('src',IDLE_ANIM_SRC);
}
function _idleStop(){
  if(!_idleOn)return; _idleOn=false;
  const fr=document.getElementById('idle-frame');
  if(fr) fr.setAttribute('src','about:blank');   // fully stop the animation while orders are showing
}
function render(){
  const b=document.querySelector('.board');b.classList.remove('d1','d2');b.classList.toggle('big',BIG);
  const empty=!DATA.in_progress.length && !DATA.ready.length;
  const idle=document.getElementById('idle');
  if(empty){ b.classList.add('hidden'); if(idle)idle.style.display='block'; _idleStart(); return; }
  b.classList.remove('hidden'); if(idle)idle.style.display='none'; _idleStop();
  renderColumn('prog',DATA.in_progress,false);
  renderColumn('ready',DATA.ready,true);
  DATA.in_progress.concat(DATA.ready).forEach(o=>seen.add(o.id));
  // (A) adaptively tighten spacing so more orders fit; if it STILL overflows, hand off to the scroller.
  // In BIG mode we skip shrinking (cards stay big) and let the slow scroll carry the overflow.
  requestAnimationFrame(()=>{
    if(!BIG && _overflows()){b.classList.add('d1');
      requestAnimationFrame(()=>{if(_overflows())b.classList.add('d2');
        requestAnimationFrame(()=>{setupScroll('prog');setupScroll('ready');});});}
    else{setupScroll('prog');setupScroll('ready');}
  });
}
function updateWaits(){document.querySelectorAll('[data-wait]').forEach(el=>{
  const t=parseInt(el.getAttribute('data-wait'));el.textContent=Math.max(0,Math.floor((Date.now()-t)/60000))+' min';});}

// DEMO preview: open /status?demo=N to fill the board with N sample orders per column (only for whoever
// opens that link — the real board is untouched). Handy to check readability from a distance.
const DEMO=Math.max(0,parseInt(new URLSearchParams(location.search).get('demo'))||0);
const BIG=/^(1|true|yes|on)$/i.test(new URLSearchParams(location.search).get('big')||'');   // ?big=1 → ~double-size cards
function _demoData(n){
  // realistic mix: in-store = "Order #N" (no name/number); delivery = customer name + number;
  // Square Online = name only (no number).
  const nm=['Nick M','Sarah M','James S','Lilly P','Aaron W','Bianca R','Chris D','Emma L','Grace O','Owen W','Priya X','Liam T'];
  const dsrc=['Uber Eats','DoorDash','Square Online'];
  const mk=(i,base,mins)=>{
    if(i%2===0) return {id:'demo'+base+i,name:'Order #'+(base+i),number:'',source:'Point of Sale',created:new Date(Date.now()-mins*60000)};
    const src=dsrc[((i-1)/2|0)%dsrc.length];
    return {id:'demo'+base+i,name:nm[i%nm.length],number:'',source:src,created:new Date(Date.now()-mins*60000)};
  };
  const ip=[],rd=[];for(let i=0;i<n;i++){ip.push(mk(i,180,2+i*2));rd.push(mk(i,140,1+i*2));}
  return {in_progress:ip,ready:rd};
}
// SELF-HEAL: the board must never sit silently frozen. Track the last good update; if polling
// stops working (tab lost its connection after the tablet slept, server hiccup, KDS feed stalled)
// show a small "Reconnecting…" notice and, if it stays down, hard-reload to re-establish everything.
let _lastOk=Date.now(),_failN=0,_staleEl=null;
function _setStale(on,msg){
  if(on){
    if(!_staleEl){_staleEl=document.createElement('div');
      _staleEl.style.cssText='position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:9999;'
        +'background:rgba(180,40,40,.92);color:#fff;font-weight:700;padding:6px 16px;border-radius:20px;'
        +'font-size:2.4vh;letter-spacing:.5px;box-shadow:0 2px 10px rgba(0,0,0,.3);pointer-events:none;';
      document.body.appendChild(_staleEl);}
    _staleEl.textContent=msg||'Reconnecting…';_staleEl.style.display='block';
  } else if(_staleEl){_staleEl.style.display='none';}
}
const IDLE_PREVIEW=/^(1|true|yes|on)$/i.test(new URLSearchParams(location.search).get('idle')||'');  // ?idle=1 → force the idle splash to preview it
let _downLong=false;
async function poll(){
  if(IDLE_PREVIEW){DATA={in_progress:[],ready:[]};render();_setStale(false);return;}
  try{
    const d=DEMO?_demoData(DEMO):await fetchOrders();
    // This fetch SUCCEEDED, so the server is confirmed back. If we'd been down a while, reload ONCE now
    // to pick up any new build + clear stale state. Safe because it only fires right after a success —
    // never into a down server (reloading during the outage is what stranded the kiosk on an error page).
    if(_downLong){location.reload();return;}
    DATA={in_progress:d.in_progress||[],ready:d.ready||[]};render();
    _lastOk=Date.now();_failN=0;
    // the page is fine but the SERVER's own order feed has stalled (KDS/Square poll stopped) → warn softly
    if(!DEMO && _lastAge!=null && _lastAge>150) _setStale(true,'Updating…');
    else _setStale(false);
  }catch(e){
    _failN++;
    const downMs=Date.now()-_lastOk;
    if(downMs>15000){_setStale(true,'Reconnecting…'); if(downMs>60000)_downLong=true;}  // keep polling — recovers on its own when the server returns
    // NOTE: never location.reload() in here — the server may still be down and we'd land on a dead error page.
  }
}
tickClock();poll();
setInterval(tickClock,1000);
setInterval(updateWaits,1000);
setInterval(poll,1200);      // real page: pulls /api/order_status (fast so a new/ready order shows near-instantly)
// the tablet screen waking from sleep can leave intervals throttled/stale → poll immediately on wake
document.addEventListener('visibilitychange',()=>{if(!document.hidden){poll();_checkBuild();}});
// AUTO-UPDATE: reload the page when the server deploys a new build, so layout/design changes appear on
// the tablet on their own (no manual reload). Watches the server's applied commit sha.
let _bootSha=null;
async function _checkBuild(){try{const r=await fetch('/api/selfupdate_status',{cache:'no-store'});const d=await r.json();const s=(d&&d.applied_sha)||'';if(!s)return;if(_bootSha===null)_bootSha=s;else if(s!==_bootSha)location.reload(true);}catch(e){}}
setInterval(_checkBuild,60000); _checkBuild();
// (page-rotation removed — overflow is handled by shrink-to-fit + gentle auto-scroll)
window.addEventListener('resize',render);
</script>
</body>
